    <style>
        :root {
            --bg-color: #FEF9E7; 
            --text-color: #1a1a1a;
            --accent: #d14c36; 
            --font-main: 'Barlow', sans-serif;
            --border-color: #e0dbca;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            line-height: 1.8;
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
            animation: fadeIn 1.2s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Navigation */
        nav { 
            padding: 80px 20px 30px 20px; 
            text-align: center; 
        }

        .site-title {
            font-size: 1.8rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            text-decoration: none !important;
            border: none !important;
            color: var(--text-color);
            display: block;
            margin-bottom: 25px;
            font-weight: 700 !important;
            line-height: 1.2;
        }

        .nav-links {
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 1rem;
            font-weight: 700 !important;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--accent);
            margin: 0 20px;
            transition: opacity 0.3s;
        }

        .nav-links a:hover { opacity: 0.6; }

        /* Two-Column Structure */
        .content-wrapper {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 40px 100px 40px;
        }

        .page-heading {
            font-size: 1.25rem;
            margin-bottom: 45px;
            font-weight: 400;
            line-height: 1.5;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-color);
            text-align: center;
        }

        .split-layout {
            display: flex;
            align-items: flex-start;
            gap: 80px;
        }

        .form-side {
            flex: 1.2;
        }

        .info-side {
            flex: 1;
            position: sticky;
            top: 40px;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        a:hover { opacity: 0.7; text-decoration: underline; }

        /* Custom Highlight Color */
        ::selection {
            background-color: #b9d8e5; 
            color: #1a1a1a;           
        }

        ::-moz-selection {
            background-color: #b9d8e5;
            color: #1a1a1a;
        }

        /* Form Styling */
        form {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .section-label {
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 700;
            color: #444;
            font-size: 0.85rem;
            margin-bottom: 4px;
            display: block;
        }

        form input, form textarea {
            font-family: var(--font-main);
            font-size: 1.05rem;
            font-weight: 300;
            padding: 12px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            outline: none;
            transition: border-color 0.3s ease;
        }

        form input:focus, form textarea:focus {
            border-color: var(--accent);
        }

        form textarea {
            resize: vertical;
            min-height: 160px;
        }

        form button {
            font-family: var(--font-main);
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
            align-self: flex-start;
        }

        form button:hover {
            opacity: 0.9;
        }
        
        form button:active {
            transform: scale(0.98);
        }

        /* Right Panel Highlight Card */
        .agent-card {
            border: 1px solid var(--border-color);
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.15);
        }

        .agent-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .agent-agency {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #666;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .agent-details {
            font-size: 1.05rem;
            margin-bottom: 0;
        }

        /* Stickers */
        .flower-sticker {
            position: fixed;
            font-size: 2rem;
            cursor: grab;
            user-select: none;
            z-index: 2000;
            color: var(--accent);
            transition: transform 0.2s ease;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.1));
        }

        .flower-sticker:active {
            cursor: grabbing;
            transform: scale(1.2) rotate(10deg);
        }

        /* Responsive Mobile Layout */
        @media (max-width: 768px) {
            nav {
                padding: 50px 20px 20px 20px;
            }
            
            .site-title {
                font-size: 1.5rem;
                letter-spacing: 0.1em;
            }

            .content-wrapper {
                padding: 0 25px 60px 25px;
            }

            .split-layout {
                flex-direction: column;
                gap: 50px;
            }

            .form-side, .info-side {
                width: 100%;
            }

            form button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    </main>

<script>
// Sparkle Mouse Trail
document.addEventListener('mousemove', function(e) {
  const sparkle = document.createElement('span');
  sparkle.innerHTML = '✧'; 
  sparkle.style.position = 'absolute';
  sparkle.style.left = e.pageX + 'px';
  sparkle.style.top = e.pageY + 'px';
  sparkle.style.color = '#B9D9EB'; 
  sparkle.style.pointerEvents = 'none';
  sparkle.style.fontSize = Math.random() * (20 - 10) + 10 + 'px';
  sparkle.style.zIndex = '9999';
  
  sparkle.animate([
    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
    { transform: `translate(${(Math.random() - 0.5) * 40}px, -40px) scale(0)`, opacity: 0 }
  ], {
    duration: 1000,
    easing: 'ease-out'
  });

  document.body.appendChild(sparkle);
  
  setTimeout(() => {
    sparkle.remove();
  }, 1000);
});

// Draggable Stickers Script
const stickers = document.querySelectorAll('.flower-sticker');

stickers.forEach(sticker => {
    let isDragging = false;
    let offsetX, offsetY;

    sticker.addEventListener('mousedown', (e) => {
        isDragging = true;
        offsetX = e.clientX - sticker.getBoundingClientRect().left;
        offsetY = e.clientY - sticker.getBoundingClientRect().top;
        sticker.style.position = 'fixed';
    });

    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        sticker.style.left = (e.clientX - offsetX) + 'px';
        sticker.style.top = (e.clientY - offsetY) + 'px';
        sticker.style.bottom = 'auto'; 
        sticker.style.right = 'auto';
    });

    document.addEventListener('mouseup', () => {
        isDragging = false;
    });
    
    // Mobile touch support
    sticker.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        offsetX = touch.clientX - sticker.getBoundingClientRect().left;
        offsetY = touch.clientY - sticker.getBoundingClientRect().top;
        isDragging = true;
    });

    document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const touch = e.touches[0];
        sticker.style.left = (touch.clientX - offsetX) + 'px';
        sticker.style.top = (touch.clientY - offsetY) + 'px';
        sticker.style.bottom = 'auto';
        sticker.style.right = 'auto';
    });

    document.addEventListener('touchend', () => {
        isDragging = false;
    });
});
</script>
