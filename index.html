    <style>
        :root {
            --bg-color: #EADBC8; 
            --text-color: #1a1a1a;
            --accent: #C85A32; 
            --font-main: 'Barlow', sans-serif;
            --font-quote: 'Playfair Display', Georgia, serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            line-height: 1.8;
            font-weight: 500;
            -webkit-font-smoothing: antialiased;
            animation: fadeIn 1.2s ease-in;
            overflow-x: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Navigation */
        nav { 
            padding: 80px 20px 30px 20px; 
            text-align: center; 
        }

        .site-title {
            font-size: 1.8rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            text-decoration: none !important;
            border: none !important;
            color: var(--text-color);
            display: block;
            margin-bottom: 25px;
            font-weight: 700 !important;
            line-height: 1.2;
        }

        .nav-links {
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 1rem;
            font-weight: 700 !important;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--accent);
            margin: 0 20px;
            transition: opacity 0.3s;
        }

        .nav-links a:hover { opacity: 0.6; }

        /* Layout Container */
        .content-wrapper {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            align-items: flex-start;
            gap: 60px;
            padding: 40px 40px 100px 40px;
            position: relative;
        }

        /* Cover Art Frame */
        .photo-side {
            flex: 1;
            max-width: 420px;
        }

        .hero-image {
            width: 100%;
            height: auto;
            display: block;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .text-side {
            flex: 1.4;
            display: flex;
            flex-direction: column;
        }

        .anticipation-badge {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .book-title-heading {
            font-size: 2.2rem;
            line-height: 1.2;
            margin: 0 0 15px 0;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Editorial Blurb Slider */
        .blurbs-slider-wrapper {
            border-top: 1px solid rgba(26, 26, 26, 0.15);
            border-bottom: 1px solid rgba(26, 26, 26, 0.15);
            padding: 30px 0 25px 0;
            margin-bottom: 40px;
            position: relative;
            min-height: 230px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .blurb-slide {
            display: none;
            animation: slideFade 0.5s ease-in-out;
        }

        .blurb-slide.active {
            display: block;
        }

        @keyframes slideFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }
